services:
  libero-remote:
    build:
      context: .
      args:
        LIBERO_PRO_REPOSITORY: ${LIBERO_PRO_REPOSITORY:-https://github.com/Zxy-MLlab/LIBERO-PRO.git}
        LIBERO_PRO_COMMIT: ${LIBERO_PRO_COMMIT:-eafdb809426b13153aa1e4c42d6601844217dfec}
    image: libero-pro-remote:${LIBERO_REMOTE_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${LIBERO_REMOTE_PUBLIC_PORT:-8000}:8000"
    environment:
      LIBERO_REMOTE_BACKEND: libero
      LIBERO_REMOTE_HOST: 0.0.0.0
      LIBERO_REMOTE_PORT: 8000
      LIBERO_REMOTE_MAX_SESSIONS: ${LIBERO_REMOTE_MAX_SESSIONS:-1}
      LIBERO_REMOTE_WORKER_TIMEOUT_SECONDS: ${LIBERO_REMOTE_WORKER_TIMEOUT_SECONDS:-120}
      LIBERO_REMOTE_SESSION_IDLE_TIMEOUT_SECONDS: ${LIBERO_REMOTE_SESSION_IDLE_TIMEOUT_SECONDS:-900}
      LIBERO_REMOTE_CLEANUP_INTERVAL_SECONDS: ${LIBERO_REMOTE_CLEANUP_INTERVAL_SECONDS:-30}
      LIBERO_REMOTE_SCHEDULER_DB_PATH: /opt/libero-remote/runtime/scheduler.sqlite3
      LIBERO_REMOTE_SCHEDULER_QUEUE_CAPACITY: ${LIBERO_REMOTE_SCHEDULER_QUEUE_CAPACITY:-4096}
      LIBERO_REMOTE_MAX_ACTIVE_SESSIONS_PER_OWNER: ${LIBERO_REMOTE_MAX_ACTIVE_SESSIONS_PER_OWNER:-1}
      LIBERO_REMOTE_HEARTBEAT_INTERVAL_SECONDS: ${LIBERO_REMOTE_HEARTBEAT_INTERVAL_SECONDS:-15}
      LIBERO_REMOTE_LEASE_GRACE_PERIOD_SECONDS: ${LIBERO_REMOTE_LEASE_GRACE_PERIOD_SECONDS:-60}
      LIBERO_REMOTE_CLAIM_INTENT_TTL_SECONDS: ${LIBERO_REMOTE_CLAIM_INTENT_TTL_SECONDS:-30}
      LIBERO_REMOTE_ALLOW_DIRECT_SESSIONS: ${LIBERO_REMOTE_ALLOW_DIRECT_SESSIONS:-true}
      LIBERO_REMOTE_LOG_LEVEL: ${LIBERO_REMOTE_LOG_LEVEL:-info}
      LIBERO_REMOTE_BDDL_ROOT: /opt/libero-remote/assets/bddl/00_original/bddl
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    volumes:
      - ./runtime:/opt/libero-remote/runtime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stop_grace_period: 30s
